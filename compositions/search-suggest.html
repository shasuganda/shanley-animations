<!doctype html>
<html lang="en" class="overlay" data-resolution="portrait" data-composition-variables='[
    {"id":"query","type":"string","label":"What gets typed into the search bar","default":"how to edit video with claude"},
    {"id":"suggestions","type":"string","label":"The suggestions that drop down, separated by |","default":"how to edit video with claude|how to edit video faster|how to edit video without an editor"},
    {"id":"pick","type":"string","label":"Which suggestion gets picked, counting from 1 (0: none)","default":"1"},
    {"id":"y","type":"string","label":"Where the search bar sits, as a percent from the top","default":"8"},
    {"id":"look","type":"string","label":"Colours: forest (green, cream, gold) or plum (the site colours)","default":"forest"},{"id":"layer","type":"string","label":"Which part to draw (set by the script)","default":"all"}
  ]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="stylesheet" href="../assets/brand.css" />
    <link rel="stylesheet" href="../assets/fx.css" />
    <script src="../assets/gsap.min.js"></script>
    <style>

      .bar { left: 60px; width: 960px; height: 132px; }
      .bar svg { position: absolute; left: 34px; top: 38px; width: 54px; height: 54px; fill: none; stroke: var(--khaki); stroke-width: 2; }
      #query { position: absolute; left: 112px; top: 26px; font-size: 62px; line-height: 1.2; white-space: nowrap; }
      #caret { display: inline-block; width: 3px; height: 62px; margin-left: 6px; background: var(--gold); vertical-align: -10px; }
      .drop { left: 60px; width: 960px; border-top: none; border-radius: 0 0 4px 4px; overflow: hidden; }
      .sug { display: flex; align-items: baseline; gap: 30px; padding: 22px 34px 26px; border-top: 1px solid var(--hair); }
      .sug .serif { font-size: 50px; color: var(--second); white-space: nowrap; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="search-suggest" data-start="0" data-duration="4" data-width="1080" data-height="1920">
      <div class="fx">

        <div class="front">
          <div class="block bar" id="bar">
            <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" /><path d="M15.5 15.5 21 21" /></svg>
            <div class="serif" id="query"><span id="typed"></span><span id="caret"></span></div>
          </div>
          <div class="block drop" id="drop"></div>
        </div>
      </div>
    </div>
    <script src="../assets/fx-kit.js"></script>
    <script>

      const { v, el, num, esc, list } = fx;
      const barTop = (num("y", 8) / 100) * 1920;
      el("bar").style.top = barTop + "px";
      el("drop").style.top = barTop + 131 + "px";
      const query = String(v.query);
      // Long searches get smaller type so they stay on one line.
      el("query").style.fontSize = Math.min(62, Math.round(1560 / Math.max(query.length, 12))) + "px";
      const items = list(v.suggestions).slice(0, 5);
      const pick = Math.round(num("pick", 1));
      el("drop").innerHTML = items.map((s, i) => `<div class="sug" id="s${i}"><span class="mono">0${i + 1}</span><span class="serif">${esc(s)}</span></div>`).join("");
      if (!items.length) fx.hide("drop");

      const tl = gsap.timeline({ paused: true });
      tl.from("#bar", { y: -360, duration: 0.3, ease: "power3.out" }, 0);
      const typing = { n: 0 };
      const typeFor = Math.min(1.3, query.length * 0.045);
      tl.to(typing, { n: query.length, duration: typeFor, ease: "none", onUpdate: () => (el("typed").textContent = query.slice(0, Math.round(typing.n))) }, 0.3);
      const after = 0.3 + typeFor * 0.55;
      tl.from("#drop", { opacity: 0, duration: 0.01 }, after);
      items.forEach((_, i) => tl.from("#s" + i, { opacity: 0, y: -18, duration: 0.2, ease: "power2.out" }, after + i * 0.09));
      if (pick >= 1 && pick <= items.length) {
        const when = 0.3 + typeFor + 0.35;
        tl.set("#s" + (pick - 1), { backgroundColor: "#14201a" }, when);
        tl.set(`#s${pick - 1} span`, { color: "#d4af37" }, when);
      }
      fx.done("search-suggest", tl);
    </script>
  </body>
</html>
