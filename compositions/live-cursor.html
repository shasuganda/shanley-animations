<!doctype html>
<html lang="en" class="overlay" data-resolution="portrait" data-composition-variables='[
    {"id":"name","type":"string","label":"Name on the cursor tag","default":"Claude"},
    {"id":"tag","type":"string","label":"Label on the selection box (empty to hide)","default":"You"},
    {"id":"boxW","type":"string","label":"Width of the selection box, as a percent of the frame","default":"46"},
    {"id":"boxH","type":"string","label":"Height of the selection box, as a percent of the frame","default":"24"},
    {"id":"headTop","type":"string","label":"Top of your head in pixels (set by the script)","default":"800"},{"id":"centreX","type":"string","label":"Middle of you in pixels (set by the script)","default":"540"},{"id":"look","type":"string","label":"Colours: forest (green, cream, gold) or plum (the site colours)","default":"forest"},{"id":"layer","type":"string","label":"Which part to draw (set by the script)","default":"all"}
  ]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="stylesheet" href="../assets/brand.css" />
    <link rel="stylesheet" href="../assets/fx.css" />
    <script src="../assets/gsap.min.js"></script>
    <style>

      #sel { position: absolute; border: 3px solid var(--gold); background: rgba(212, 175, 55, 0.08); }
      .h { position: absolute; width: 18px; height: 18px; background: var(--cream); border: 3px solid var(--gold); }
      #tag { position: absolute; left: -3px; top: -46px; padding: 6px 12px 7px; background: var(--gold); color: var(--bar); font-size: 22px; letter-spacing: 0.18em; }
      #size { position: absolute; left: 50%; bottom: -52px; transform: translateX(-50%); padding: 6px 12px 7px; background: var(--bar); border: 1px solid var(--hair); font-size: 22px; letter-spacing: 0.14em; color: var(--cream); }
      #cursor { position: absolute; left: 0; top: 0; width: 0; height: 0; }
      #cursor svg { position: absolute; left: -6px; top: -4px; width: 64px; height: 64px; filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.4)); }
      #who { position: absolute; left: 44px; top: 56px; padding: 7px 14px 8px; background: var(--gold); color: var(--bar); font-size: 22px; letter-spacing: 0.18em; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="live-cursor" data-start="0" data-duration="4" data-width="1080" data-height="1920">
      <div class="fx">

        <div class="front">
          <div id="sel">
            <div class="mono" id="tag"></div>
            <div class="h" style="left:-11px;top:-11px"></div><div class="h" style="right:-11px;top:-11px"></div>
            <div class="h" style="left:-11px;bottom:-11px"></div><div class="h" style="right:-11px;bottom:-11px"></div>
            <div class="mono" id="size"></div>
          </div>
          <div id="cursor">
            <svg viewBox="0 0 24 24"><path d="M4 2.5 19 11l-6.6 1.7L9.6 19z" fill="#f0e8e0" stroke="#14201a" stroke-width="1.4" stroke-linejoin="round" /></svg>
            <div class="mono" id="who"></div>
          </div>
        </div>
      </div>
    </div>
    <script src="../assets/fx-kit.js"></script>
    <script>

      const { v, el, num } = fx;
      const w = Math.round((num("boxW", 46) / 100) * 1080);
      const h = Math.round((num("boxH", 24) / 100) * 1920);
      const cx = num("centreX", 540);
      const x0 = Math.round(Math.max(30, Math.min(1050 - w, cx - w / 2)));
      const y0 = Math.round(Math.max(70, num("headTop", 800) - 50));
      const sel = el("sel");
      Object.assign(sel.style, { left: x0 + "px", top: y0 + "px", width: "0px", height: "0px" });
      el("who").textContent = v.name;
      el("tag").textContent = v.tag;
      if (!String(v.tag).trim()) fx.hide("tag");
      if (!String(v.name).trim()) fx.hide("who");

      // The cursor glides in, drags a box around your head, and lets go.
      const tl = gsap.timeline({ paused: true });
      const drag = { p: 0 };
      gsap.set("#sel", { opacity: 0 });
      tl.fromTo("#cursor", { x: 1180, y: y0 + 700 }, { x: x0, y: y0, duration: 0.55, ease: "power3.out" }, 0);
      tl.to("#cursor svg", { scale: 0.82, duration: 0.07, transformOrigin: "10% 10%" }, 0.6);
      tl.set("#sel", { opacity: 1 }, 0.67);
      tl.to(drag, {
        p: 1, duration: 0.6, ease: "power2.inOut",
        onUpdate: () => {
          sel.style.width = Math.round(w * drag.p) + "px";
          sel.style.height = Math.round(h * drag.p) + "px";
          el("size").textContent = `${Math.round(w * drag.p)} × ${Math.round(h * drag.p)}`;
        },
      }, 0.67);
      tl.to("#cursor", { x: x0 + w, y: y0 + h, duration: 0.6, ease: "power2.inOut" }, 0.67);
      tl.to("#cursor svg", { scale: 1, duration: 0.1 }, 1.3);
      tl.to("#cursor", { x: x0 + w + 70, y: y0 + h + 90, duration: 0.5, ease: "power2.out" }, 1.5);
      fx.done("live-cursor", tl);
    </script>
  </body>
</html>
