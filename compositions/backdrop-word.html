<!doctype html>
<html
  lang="en"
  class="overlay"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"phrase","type":"string","label":"The giant words behind you (words in *stars* take the second colour)","default":"Claude *did.*"},
    {"id":"phraseY","type":"string","label":"Where the middle of the giant words sits, as a percent from the top (keep it above your head)","default":"24"},
    {"id":"background","type":"color","label":"Backdrop colour that replaces your room (forest green; the site plum is #2e1a2b)","default":"#203028"},
    {"id":"color","type":"color","label":"Colour of the giant words","default":"#f0e8e0"},
    {"id":"accent","type":"color","label":"Second colour, for words in *stars* (gold; the site blush is #dcb9d3)","default":"#d4af37"},
    {"id":"caption","type":"string","label":"Caption in the box (words in *stars* are lighter; empty to hide)","default":"Claude did."},
    {"id":"captionY","type":"string","label":"Where the caption box sits, as a percent from the top","default":"70"},
    {"id":"look","type":"string","label":"Caption box colours: forest (as in the Editing with Claude video) or plum (the site colours)","default":"forest"},
    {"id":"layer","type":"string","label":"Which part to draw: all, behind (backdrop and giant words) or front (the caption)","default":"all"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="stylesheet" href="../assets/brand.css" />
    <script src="../assets/gsap.min.js"></script>
    <style>
      .backdrop {
        position: absolute;
        inset: 0;
      }
      /* Oversized italic words that run off the right edge and drift slowly left. */
      .phrase {
        position: absolute;
        left: 40px;
        font-family: var(--font-display);
        font-style: italic;
        font-size: 400px;
        line-height: 1;
        letter-spacing: -0.02em;
        white-space: nowrap;
      }
      .caption-box {
        border: 2px solid rgba(250, 247, 242, 0.16);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="backdrop-word"
      data-start="0"
      data-duration="4"
      data-width="1080"
      data-height="1920"
    >
      <div class="fx">
        <div class="behind">
          <div class="backdrop" id="backdrop"></div>
          <div class="phrase" id="phrase"></div>
        </div>
        <div class="front">
          <div class="caption-box" id="caption"></div>
        </div>
      </div>
    </div>

    <script>
      const v = window.__hyperframes.getVariables();
      const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      const pct = (value, fallback) => (Number.isFinite(parseFloat(value)) ? parseFloat(value) : fallback);

      if (v.look !== "plum") document.documentElement.classList.add("forest");
      document.getElementById("backdrop").style.background = v.background;

      const phrase = document.getElementById("phrase");
      phrase.style.color = v.color;
      phrase.style.top = Math.round((pct(v.phraseY, 24) / 100) * 1920 - 200) + "px";
      phrase.innerHTML = esc(v.phrase).replace(/\*(.+?)\*/g, `<span style="color:${esc(v.accent)}">$1</span>`);

      const caption = document.getElementById("caption");
      caption.innerHTML = esc(v.caption).replace(/\*(.+?)\*/g, "<em>$1</em>");
      caption.style.top = (pct(v.captionY, 70) / 100) * 1920 + "px";
      if (!String(v.caption).trim()) caption.style.display = "none";

      if (v.layer === "behind") document.querySelector(".front").style.display = "none";
      if (v.layer === "front") document.querySelector(".behind").style.display = "none";

      // Longer phrases drift further so more of the words pass through the frame.
      const length = String(v.phrase).replace(/\*/g, "").length;
      const drift = Math.max(120, (length - 6) * 60);

      const tl = gsap.timeline({ paused: true });
      tl.from("#backdrop", { opacity: 0, duration: 0.25, ease: "power1.out" }, 0);
      tl.fromTo("#phrase", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 0.1);
      tl.fromTo("#phrase", { x: 260 }, { x: -drift, duration: 3.9, ease: "power2.out" }, 0.1);
      tl.from("#caption", { opacity: 0, y: 24, duration: 0.3, ease: "power3.out" }, 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines["backdrop-word"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
