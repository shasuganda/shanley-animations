<!doctype html>
<html
  lang="en"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"eyebrow","type":"string","label":"Small line above the title","default":"Season direction"},
    {"id":"title","type":"string","label":"Title (wrap a word in *stars* for italic mauve)","default":"The *mood,* pinned"},
    {"id":"cards","type":"string","label":"Up to 5 cards as Label|#colour or Label|image path, separated by ;","default":"Washed olive|#7a7f5a;Bone|#e9e2d3;Rust|#a4532f;Ink navy|#27324a;Mauve haze|#b08fa8"},
    {"id":"keywords","type":"string","label":"Keyword tags, separated by |","default":"Utility|Soft structure|Garment washed"},
    {"id":"signature","type":"string","label":"Corner signature (empty to hide)","default":"Shanley AI"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="stylesheet" href="../assets/brand.css" />
    <script src="../assets/gsap.min.js"></script>
    <style>
      .head {
        position: absolute;
        left: 72px;
        right: 72px;
        top: 250px;
      }
      .head .headline {
        margin-top: 22px;
      }
      .card {
        position: absolute;
        padding: 18px 18px 0;
        background: var(--paper);
        border-radius: 6px;
        box-shadow: 0 26px 50px rgba(26, 26, 26, 0.2);
      }
      .card .fill {
        width: 100%;
        height: calc(100% - 92px);
        border-radius: 3px;
        background-color: var(--c, var(--cream-dark));
        background-size: cover;
        background-position: center;
        box-shadow: inset 0 0 0 1px rgba(26, 26, 26, 0.06);
      }
      .card .label {
        height: 92px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-family: var(--font-display);
        font-size: 44px;
        white-space: nowrap;
      }
      .card .label small {
        font-family: var(--font-sans);
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--ink-subtle);
      }
      .pin {
        position: absolute;
        left: 50%;
        top: -20px;
        width: 44px;
        height: 44px;
        margin-left: -22px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #fff 0 14%, var(--mauve) 16% 70%, var(--mauve-deep) 100%);
        box-shadow: 0 10px 14px rgba(26, 26, 26, 0.3);
      }
      .keywords {
        position: absolute;
        left: 72px;
        right: 72px;
        top: 1640px;
        display: flex;
        flex-wrap: wrap;
        gap: 18px;
      }
      .keywords span {
        padding: 16px 30px 18px;
        border: 3px solid var(--ink);
        border-radius: 999px;
        font-size: 34px;
        font-weight: 600;
        background: var(--cream);
      }
      .keywords span:first-child {
        background: var(--ink);
        color: var(--cream);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="moodboard-pins"
      data-start="0"
      data-duration="6"
      data-width="1080"
      data-height="1920"
    >
      <div class="stage">
        <div class="head">
          <div class="eyebrow" id="eyebrow"></div>
          <h1 class="headline" id="title"></h1>
        </div>
        <div id="board"></div>
        <div class="keywords" id="keywords"></div>
        <div class="signature" id="signature"></div>
      </div>
    </div>

    <script>
      const v = window.__hyperframes.getVariables();
      const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      const rich = (s) => esc(s).replace(/\*(.+?)\*/g, "<em>$1</em>");

      document.getElementById("eyebrow").textContent = v.eyebrow;
      document.getElementById("title").innerHTML = rich(v.title);
      document.getElementById("signature").textContent = v.signature;

      // Fixed places on the board: left, top, width, height, tilt, stacking order.
      const SLOTS = [
        [72, 650, 430, 500, -4, 1],
        [560, 620, 448, 390, 3, 2],
        [580, 1070, 410, 470, -3, 3],
        [96, 1200, 430, 390, 5, 4],
        [356, 1010, 300, 320, -7, 5],
      ];
      const cards = String(v.cards)
        .split(";")
        .map((c) => c.split("|").map((x) => x.trim()))
        .filter((c) => c[0])
        .slice(0, SLOTS.length);

      const board = document.getElementById("board");
      cards.forEach(([label, value = ""], i) => {
        const [left, top, w, h, , z] = SLOTS[i];
        const isColor = /^#[0-9a-f]{3,8}$/i.test(value);
        const el = document.createElement("div");
        el.className = "card";
        el.style.cssText = `left:${left}px;top:${top}px;width:${w}px;height:${h}px;z-index:${z}`;
        el.innerHTML = `<div class="pin"></div><div class="fill"></div><div class="label"><span>${esc(label)}</span>${isColor && w >= 400 ? `<small>${esc(value)}</small>` : ""}</div>`;
        const fill = el.querySelector(".fill");
        if (isColor) fill.style.setProperty("--c", value);
        else if (value) fill.style.backgroundImage = `url("${value.replace(/"/g, "%22")}")`;
        board.appendChild(el);
      });

      document.getElementById("keywords").innerHTML = String(v.keywords)
        .split("|")
        .map((k) => k.trim())
        .filter(Boolean)
        .map((k) => `<span>${esc(k)}</span>`)
        .join("");

      const tl = gsap.timeline({ paused: true });
      tl.from("#eyebrow", { opacity: 0, y: 24, duration: 0.45, ease: "power3.out" }, 0.1);
      tl.from("#title", { opacity: 0, y: 46, duration: 0.6, ease: "power3.out" }, 0.22);

      // Each card drops onto the board, then its pin goes in.
      document.querySelectorAll(".card").forEach((el, i) => {
        const tilt = SLOTS[i][4];
        const at = 0.85 + i * 0.5;
        tl.fromTo(
          el,
          { opacity: 0, scale: 1.3, y: -70, rotation: tilt * 3 },
          { opacity: 1, scale: 1, y: 0, rotation: tilt, duration: 0.5, ease: "power3.out" },
          at,
        );
        tl.fromTo(
          el.querySelector(".pin"),
          { opacity: 0, scale: 2.4, y: -40 },
          { opacity: 1, scale: 1, y: 0, duration: 0.22, ease: "power3.in" },
          at + 0.34,
        );
      });

      const after = 0.85 + cards.length * 0.5 + 0.35;
      tl.from(".keywords span", { opacity: 0, y: 30, duration: 0.4, ease: "back.out(1.8)", stagger: 0.14 }, after);

      window.__timelines = window.__timelines || {};
      window.__timelines["moodboard-pins"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
