<!doctype html>
<html lang="en" class="overlay" data-resolution="portrait" data-composition-variables='[
    {"id":"value","type":"string","label":"The number in the corners","default":"100"},
    {"id":"title","type":"string","label":"Line across the top","default":"Legal tender"},
    {"id":"line","type":"string","label":"Line across the bottom","default":"One hundred"},
    {"id":"serial","type":"string","label":"Serial number (empty to hide)","default":"SA 2026 1122"},
    {"id":"look","type":"string","label":"Colours: forest (green, cream, gold) or plum (the site colours)","default":"forest"},{"id":"layer","type":"string","label":"Which part to draw (set by the script)","default":"all"}
  ]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="stylesheet" href="../assets/brand.css" />
    <link rel="stylesheet" href="../assets/fx.css" />
    <script src="../assets/gsap.min.js"></script>
    <style>

      /* The portrait window is a see-through oval; its huge shadow is the paper around it. */
      #oval { position: absolute; left: 160px; top: 430px; width: 760px; height: 1000px; border-radius: 50%; box-shadow: 0 0 0 3000px #e9e3cf; }
      .ring { position: absolute; border-radius: 50%; border: 2px solid #203028; }
      #lace { position: absolute; left: 112px; top: 382px; width: 856px; height: 1096px; border-radius: 50%; border: 26px solid transparent; background: repeating-conic-gradient(#203028 0deg 1.2deg, transparent 1.2deg 3deg) border-box; -webkit-mask: linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; opacity: 0.8; }
      .edge { position: absolute; border: 3px solid #203028; }
      #weave { position: absolute; left: 62px; top: 62px; width: 956px; height: 1796px; border: 30px solid transparent; background: repeating-linear-gradient(45deg, #203028 0 2px, transparent 2px 9px) border-box, repeating-linear-gradient(-45deg, #203028 0 2px, transparent 2px 9px) border-box; -webkit-mask: linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; opacity: 0.75; }
      .ink { color: #203028; }
      .val { position: absolute; font-size: 170px; line-height: 1; }
      .wide { position: absolute; left: 0; width: 1080px; text-align: center; }
      #title { top: 200px; font-size: 34px; letter-spacing: 0.42em; }
      #line { top: 1560px; font-size: 96px; line-height: 1; font-style: italic; }
      #serial { position: absolute; left: 0; width: 1080px; top: 1694px; text-align: center; font-size: 26px; letter-spacing: 0.3em; }
      #seal { position: absolute; left: 470px; top: 262px; width: 140px; height: 140px; border-radius: 50%; border: 3px solid #203028; background: #d4af37; display: flex; align-items: center; justify-content: center; font-size: 76px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="banknote" data-start="0" data-duration="4" data-width="1080" data-height="1920">
      <div class="fx">

        <div id="oval"></div>
        <div id="lace"></div>
        <div class="ring" style="left:150px;top:420px;width:780px;height:1020px"></div>
        <div class="ring" style="left:100px;top:370px;width:880px;height:1120px"></div>
        <div class="edge" style="left:40px;top:40px;width:1000px;height:1840px"></div>
        <div id="weave"></div>
        <div class="edge" style="left:104px;top:104px;width:872px;height:1712px;border-width:1px"></div>
        <div class="serif ink val" id="v0" style="left:136px;top:130px"></div>
        <div class="serif ink val" id="v1" style="right:136px;top:130px"></div>
        <div class="serif ink val" id="v2" style="left:136px;top:1420px;font-size:110px"></div>
        <div class="serif ink val" id="v3" style="right:136px;top:1420px;font-size:110px"></div>
        <div class="mono ink wide" id="title"></div>
        <div class="serif ink" id="seal"></div>
        <div class="serif ink wide" id="line"></div>
        <div class="mono ink" id="serial"></div>
      </div>
    </div>
    <script src="../assets/fx-kit.js"></script>
    <script>

      const { v, el } = fx;
      const value = String(v.value).trim();
      const big = Math.min(170, Math.round(430 / Math.max(value.length, 2)));
      [0, 1, 2, 3].forEach((i) => {
        el("v" + i).textContent = value;
        el("v" + i).style.fontSize = (i < 2 ? big : Math.round(big * 0.65)) + "px";
      });
      el("title").textContent = v.title;
      el("line").textContent = v.line;
      el("serial").textContent = v.serial;
      el("seal").textContent = value.slice(0, 1);
      const tl = gsap.timeline({ paused: true });
      tl.from("#seal", { scale: 1.6, opacity: 0, rotation: -12, duration: 0.25, ease: "power3.in" }, 0.25);
      tl.from("#line", { opacity: 0, y: 20, duration: 0.25, ease: "power3.out" }, 0.1);
      fx.done("banknote", tl);
    </script>
  </body>
</html>
