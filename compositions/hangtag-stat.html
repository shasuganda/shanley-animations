<!doctype html>
<html
  lang="en"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"eyebrow","type":"string","label":"Small line at the top of the tag","default":"Your number"},
    {"id":"number","type":"string","label":"The big number, with any symbol (48, 3x, $19, 87%)","default":"48"},
    {"id":"unit","type":"string","label":"Unit next to the number (empty for none)","default":"hrs"},
    {"id":"label","type":"string","label":"What the number means (wrap a word in *stars* for italic mauve)","default":"from sketch to *first sample*"},
    {"id":"source","type":"string","label":"Source line (empty to hide). Always cite a real source for a real number.","default":"Example figure. Replace with your own."},
    {"id":"signature","type":"string","label":"Brand line printed on the tag","default":"Shanley AI"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="stylesheet" href="../assets/brand.css" />
    <script src="../assets/gsap.min.js"></script>
    <style>
      /* Everything hangs from one point at the top centre and swings around it. */
      .swing {
        position: absolute;
        left: 540px;
        top: -40px;
        width: 0;
        height: 0;
        transform-origin: 0 0;
      }
      .string {
        position: absolute;
        left: -3px;
        top: 0;
        width: 6px;
        height: 470px;
        background: linear-gradient(90deg, #5a3753, #9a6c90 50%, #5a3753);
        border-radius: 3px;
      }
      .tag {
        position: absolute;
        left: -370px;
        top: 400px;
        width: 740px;
        height: 1180px;
        padding: 190px 64px 0;
        background: var(--paper);
        box-shadow: 0 40px 80px rgba(26, 26, 26, 0.22);
        clip-path: polygon(22% 0, 78% 0, 100% 13%, 100% 100%, 0 100%, 0 13%);
        text-align: center;
      }
      .tag::before {
        /* stitched border */
        content: "";
        position: absolute;
        inset: 26px;
        border: 4px dashed var(--mauve);
        clip-path: polygon(21% 0, 79% 0, 100% 12.4%, 100% 100%, 0 100%, 0 12.4%);
        opacity: 0.55;
      }
      .hole {
        position: absolute;
        left: 50%;
        top: 46px;
        width: 56px;
        height: 56px;
        margin-left: -28px;
        border-radius: 50%;
        background: var(--cream);
        box-shadow:
          inset 0 4px 8px rgba(26, 26, 26, 0.3),
          0 0 0 8px var(--mauve);
      }
      .tag .eyebrow {
        font-size: 28px;
      }
      .figure {
        margin-top: 34px;
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: 14px;
        font-family: var(--font-display);
        line-height: 0.9;
        color: var(--ink);
      }
      .figure .num {
        font-size: 330px;
        letter-spacing: -0.03em;
        font-variant-numeric: tabular-nums;
      }
      .figure .unit {
        font-size: 110px;
        font-style: italic;
        color: var(--mauve);
      }
      .rule {
        width: 120px;
        height: 6px;
        margin: 44px auto 40px;
        background: var(--ink);
        transform-origin: 50% 50%;
      }
      .label {
        font-family: var(--font-display);
        font-size: 74px;
        line-height: 1.06;
      }
      .label em {
        font-style: italic;
        color: var(--mauve);
      }
      .source {
        margin-top: 34px;
        font-size: 26px;
        font-weight: 400;
        color: var(--ink-subtle);
      }
      .foot {
        position: absolute;
        left: 64px;
        right: 64px;
        bottom: 64px;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
      }
      .foot .brand {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
      .barcode {
        width: 250px;
        height: 84px;
        background: repeating-linear-gradient(
          90deg,
          var(--ink) 0 4px,
          transparent 4px 7px,
          var(--ink) 7px 9px,
          transparent 9px 15px,
          var(--ink) 15px 21px,
          transparent 21px 24px,
          var(--ink) 24px 26px,
          transparent 26px 31px
        );
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="hangtag-stat"
      data-start="0"
      data-duration="6"
      data-width="1080"
      data-height="1920"
    >
      <div class="stage">
        <div class="swing" id="swing">
          <div class="string"></div>
          <div class="tag">
            <div class="hole"></div>
            <div class="eyebrow" id="eyebrow"></div>
            <div class="figure"><span class="num" id="num"></span><span class="unit" id="unit"></span></div>
            <div class="rule" id="rule"></div>
            <div class="label" id="label"></div>
            <div class="source" id="source"></div>
            <div class="foot"><span class="brand" id="brand"></span><span class="barcode"></span></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const v = window.__hyperframes.getVariables();
      const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      const rich = (s) => esc(s).replace(/\*(.+?)\*/g, "<em>$1</em>");

      document.getElementById("eyebrow").textContent = v.eyebrow;
      document.getElementById("unit").textContent = v.unit;
      document.getElementById("label").innerHTML = rich(v.label);
      document.getElementById("source").textContent = v.source;
      document.getElementById("brand").textContent = v.signature;

      // Split "$1,250.5k" into prefix, number and suffix so the number can count up.
      const raw = String(v.number);
      const m = raw.match(/^([^0-9]*)([0-9][0-9.,]*)(.*)$/);
      const numEl = document.getElementById("num");
      const prefix = m ? m[1] : "";
      const suffix = m ? m[3] : "";
      const target = m ? parseFloat(m[2].replace(/,/g, "")) : 0;
      const decimals = m && m[2].includes(".") ? m[2].split(".")[1].length : 0;
      const grouped = m ? m[2].includes(",") : false;
      const show = (n) => {
        const fixed = n.toFixed(decimals);
        const text = grouped ? Number(fixed).toLocaleString("en-US", { minimumFractionDigits: decimals }) : fixed;
        numEl.textContent = prefix + text + suffix;
      };
      if (m) show(0);
      else numEl.textContent = raw;

      // Long numbers shrink to stay on the tag.
      const length = raw.length + String(v.unit).length * 0.4;
      if (length > 4) numEl.style.fontSize = Math.max(150, Math.round(330 * (4 / length))) + "px";

      const tl = gsap.timeline({ paused: true });

      // The tag drops in on its string and swings to rest.
      tl.fromTo("#swing", { y: -1700 }, { y: 0, duration: 0.75, ease: "power3.out" }, 0.1);
      tl.fromTo("#swing", { rotation: 15 }, { rotation: 0, duration: 3.4, ease: "elastic.out(1.1, 0.22)" }, 0.1);

      tl.from("#eyebrow", { opacity: 0, y: 20, duration: 0.4, ease: "power3.out" }, 0.9);
      if (m) {
        const counter = { n: 0 };
        tl.to(counter, { n: target, duration: 1.3, ease: "power3.out", onUpdate: () => show(counter.n) }, 1.05);
      }
      tl.from("#num", { opacity: 0, scale: 0.7, duration: 0.5, ease: "back.out(1.8)" }, 1.05);
      tl.from("#unit", { opacity: 0, x: -24, duration: 0.4, ease: "power3.out" }, 1.7);
      tl.from("#rule", { scaleX: 0, duration: 0.4, ease: "power3.out" }, 2.2);
      tl.from("#label", { opacity: 0, y: 30, duration: 0.5, ease: "power3.out" }, 2.4);
      tl.from("#source", { opacity: 0, duration: 0.5 }, 3.0);

      window.__timelines = window.__timelines || {};
      window.__timelines["hangtag-stat"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
