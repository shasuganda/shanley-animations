<!doctype html>
<html
  lang="en"
  class="overlay"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"masthead","type":"string","label":"The big word behind your head (one short word works best)","default":"SHANLEY"},
    {"id":"mastheadY","type":"string","label":"Where the middle of the big word sits, as a percent from the top (put it across the top of your head)","default":"45"},
    {"id":"overline","type":"string","label":"Small italic line sitting on top of the big word, in the accent colour (empty to hide)","default":""},
    {"id":"look","type":"string","label":"Colours: forest (green, cream, yellow, as in the Editing with Claude video) or plum (the site colours)","default":"forest"},
    {"id":"issue","type":"string","label":"Line above the big word, parts separated by |","default":"No. 01|November 2026|Edited by Claude"},
    {"id":"kicker","type":"string","label":"Small label in the top corner (empty to hide)","default":"One sentence"},
    {"id":"kickerTitle","type":"string","label":"Bold line under the small label (empty to hide)","default":"The whole video"},
    {"id":"barcode","type":"string","label":"Text under the barcode (empty to hide the barcode)","default":"NO. 01  NOV 2026"},
    {"id":"caption","type":"string","label":"Caption in the box (words in *stars* are lighter; empty to hide)","default":"like a magazine *cover.*"},
    {"id":"captionY","type":"string","label":"Where the caption box sits, as a percent from the top","default":"70"},
    {"id":"layer","type":"string","label":"Which part to draw: all, behind (the big word) or front (everything else)","default":"all"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="stylesheet" href="../assets/brand.css" />
    <script src="../assets/gsap.min.js"></script>
    <style>
      /* A soft shade behind the type so cream letters read on any room. */
      .shade {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(20, 12, 19, 0.5) 0%, rgba(20, 12, 19, 0.28) 55%, rgba(20, 12, 19, 0) 80%);
      }
      .masthead {
        position: absolute;
        left: 0;
        width: 1080px;
        text-align: center;
        font-family: var(--font-display);
        color: var(--cream);
        line-height: 0.8;
        letter-spacing: -0.01em;
        white-space: nowrap;
        text-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
      }
      .overline {
        position: absolute;
        left: 0;
        width: 1080px;
        text-align: center;
        font-family: var(--font-display);
        font-style: italic;
        color: var(--blush);
        line-height: 1;
        white-space: nowrap;
        text-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
      }
      .issue {
        position: absolute;
        left: 0;
        width: 1080px;
        text-align: center;
        font-family: var(--font-mono);
        font-size: 27px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: rgba(250, 247, 242, 0.82);
        white-space: nowrap;
      }
      .issue i {
        font-style: normal;
        padding: 0 16px;
        opacity: 0.6;
      }
      .kicker {
        position: absolute;
        left: 60px;
        top: 190px;
      }
      .kicker .small {
        font-family: var(--font-mono);
        font-size: 27px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--blush);
      }
      .kicker .big {
        margin-top: 22px;
        font-family: var(--font-sans);
        font-weight: 800;
        font-size: 50px;
        color: var(--cream);
      }
      .sticker {
        position: absolute;
        left: 40px;
        padding: 16px 16px 12px;
        background: #fff;
        box-shadow: 0 12px 26px rgba(0, 0, 0, 0.3);
      }
      .sticker .bars {
        width: 168px;
        height: 96px;
        background: repeating-linear-gradient(
          90deg,
          #111 0 4px,
          transparent 4px 7px,
          #111 7px 9px,
          transparent 9px 14px,
          #111 14px 20px,
          transparent 20px 23px,
          #111 23px 25px,
          transparent 25px 30px
        );
      }
      .sticker .code {
        margin-top: 10px;
        font-family: var(--font-mono);
        font-size: 17px;
        letter-spacing: 0.04em;
        color: #111;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="cover-masthead"
      data-start="0"
      data-duration="4"
      data-width="1080"
      data-height="1920"
    >
      <div class="fx">
        <div class="behind">
          <div class="shade" id="shade"></div>
          <div class="overline" id="overline"></div>
          <div class="masthead" id="masthead"></div>
        </div>
        <div class="front">
          <div class="kicker" id="kicker">
            <div class="small" id="kickerSmall"></div>
            <div class="big" id="kickerBig"></div>
          </div>
          <div class="issue" id="issue"></div>
          <div class="sticker" id="sticker">
            <div class="bars"></div>
            <div class="code" id="code"></div>
          </div>
          <div class="caption-box" id="caption"></div>
        </div>
      </div>
    </div>

    <script>
      const v = window.__hyperframes.getVariables();
      const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      const rich = (s) => esc(s).replace(/\*(.+?)\*/g, "<em>$1</em>");
      const hide = (id) => (document.getElementById(id).style.display = "none");
      const pct = (value, fallback) => (Number.isFinite(parseFloat(value)) ? parseFloat(value) : fallback);

      // The big word is sized to span the frame, whatever its length.
      const word = String(v.masthead).trim();
      const size = Math.round(Math.min(430, 1010 / (Math.max(word.length, 3) * 0.5)));
      const midY = (pct(v.mastheadY, 45) / 100) * 1920;
      const mast = document.getElementById("masthead");
      mast.textContent = word;
      mast.style.fontSize = size + "px";
      mast.style.top = Math.round(midY - size * 0.42) + "px";

      const issue = document.getElementById("issue");
      issue.innerHTML = String(v.issue).split("|").map((p) => esc(p.trim())).filter(Boolean).join("<i>·</i>");
      if (v.look !== "plum") document.documentElement.classList.add("forest");

      // Optional italic line resting on the big word, as in "Editing with / CLAUDE".
      const over = document.getElementById("overline");
      const overText = String(v.overline).trim();
      const overSize = overText ? Math.round(size * 0.42) : 0;
      over.textContent = overText;
      over.style.fontSize = overSize + "px";
      over.style.top = Math.round(midY - size * 0.42 - overSize * 0.86) + "px";
      if (!overText) hide("overline");

      issue.style.top = Math.round(midY - size * 0.42 - overSize * 0.86 - 92) + "px";

      const sticker = document.getElementById("sticker");
      sticker.style.top = Math.round(midY + size * 0.42 + 70) + "px";
      document.getElementById("code").textContent = v.barcode;
      if (!String(v.barcode).trim()) hide("sticker");

      document.getElementById("kickerSmall").textContent = v.kicker;
      document.getElementById("kickerBig").textContent = v.kickerTitle;
      if (!String(v.kicker).trim() && !String(v.kickerTitle).trim()) hide("kicker");

      const caption = document.getElementById("caption");
      caption.innerHTML = rich(v.caption);
      caption.style.top = (pct(v.captionY, 70) / 100) * 1920 + "px";
      if (!String(v.caption).trim()) hide("caption");

      if (v.layer === "behind") document.querySelector(".front").style.display = "none";
      if (v.layer === "front") document.querySelector(".behind").style.display = "none";

      const tl = gsap.timeline({ paused: true });
      tl.from("#shade", { opacity: 0, duration: 0.4, ease: "power1.out" }, 0);
      tl.from("#masthead", { opacity: 0, y: 70, scale: 1.08, duration: 0.6, ease: "power3.out" }, 0.05);
      tl.from("#overline", { opacity: 0, y: 30, duration: 0.45, ease: "power3.out" }, 0.2);
      tl.from("#issue", { opacity: 0, y: 16, duration: 0.4, ease: "power3.out" }, 0.35);
      tl.from("#kicker", { opacity: 0, x: -30, duration: 0.4, ease: "power3.out" }, 0.45);
      tl.from("#sticker", { opacity: 0, scale: 1.5, rotation: -8, duration: 0.3, ease: "power3.in" }, 0.6);
      tl.from("#caption", { opacity: 0, y: 24, duration: 0.3, ease: "power3.out" }, 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines["cover-masthead"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
