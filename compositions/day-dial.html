<!doctype html>
<html lang="en" class="overlay" data-resolution="portrait" data-composition-variables='[
    {"id":"items","type":"string","label":"What is written round the dial, separated by |","default":"Mon|Tue|Wed|Thu|Fri|Sat|Sun"},
    {"id":"pick","type":"string","label":"The one the dial lands on (spelled as in the list)","default":"Fri"},
    {"id":"label","type":"string","label":"Small line above the dial (empty to hide)","default":""},
    {"id":"radius","type":"string","label":"Size of the dial, in pixels from its middle to the words","default":"400"},
    {"id":"turns","type":"string","label":"How many times it spins before landing","default":"1.5"},
    {"id":"headTop","type":"string","label":"Top of your head in pixels (set by the script)","default":"800"},{"id":"centreX","type":"string","label":"Middle of you in pixels (set by the script)","default":"540"},{"id":"look","type":"string","label":"Colours: forest (green, cream, yellow) or plum (the site colours)","default":"forest"},{"id":"layer","type":"string","label":"Which part to draw (set by the script)","default":"all"}
  ]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="stylesheet" href="../assets/brand.css" />
    <link rel="stylesheet" href="../assets/fx.css" />
    <script src="../assets/gsap.min.js"></script>
    <style>

      #dial { position: absolute; width: 0; height: 0; }
      .band { position: absolute; border-radius: 50%; border-style: solid; border-color: rgba(20, 32, 26, 0.78); box-shadow: 0 0 0 1px var(--hair), inset 0 0 0 1px var(--hair); }
      .item { position: absolute; left: 0; top: 0; width: 0; height: 0; }
      .item span { position: absolute; left: -200px; width: 400px; text-align: center; font-size: 92px; line-height: 1; white-space: nowrap; }
      .tick { position: absolute; left: -1px; width: 2px; height: 22px; background: var(--khaki); opacity: 0.7; }
      #pointer { position: absolute; width: 0; height: 0; border-left: 20px solid transparent; border-right: 20px solid transparent; border-top: 30px solid var(--yellow); }
      #label { position: absolute; left: 0; width: 1080px; text-align: center; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="day-dial" data-start="0" data-duration="4" data-width="1080" data-height="1920">
      <div class="fx">

        <div class="behind">
          <div class="band" id="band"></div>
          <div id="dial"></div>
          <div id="pointer"></div>
          <div class="mono" id="label"></div>
        </div>
      </div>
    </div>
    <script src="../assets/fx-kit.js"></script>
    <script>

      const { v, el, num, esc, list } = fx;
      const items = list(v.items);
      const R = num("radius", 400);
      const cx = num("centreX", 540);
      const cy = num("headTop", 800) + 170;
      const thick = 150;
      Object.assign(el("band").style, { left: cx - R - thick / 2 + "px", top: cy - R - thick / 2 + "px", width: 2 * R + thick + "px", height: 2 * R + thick + "px", borderWidth: thick + "px" });
      const dial = el("dial");
      Object.assign(dial.style, { left: cx + "px", top: cy + "px" });
      const step = 360 / items.length;
      const size = Math.min(92, Math.round((2 * Math.PI * R) / items.length / Math.max(...items.map((s) => s.length), 3) / 0.5));
      dial.innerHTML = items.map((s, i) =>
        `<div class="item" style="transform:rotate(${i * step}deg)"><span class="serif" id="i${i}" style="top:${-R - size * 0.5}px;font-size:${size}px">${esc(s)}</span>` +
        `<div class="tick" style="top:${-R + thick / 2 - 26}px;transform-origin:1px ${R - thick / 2 + 26}px;transform:rotate(${step / 2}deg)"></div></div>`).join("");
      Object.assign(el("pointer").style, { left: cx - 20 + "px", top: cy - R - thick / 2 - 34 + "px" });
      el("label").textContent = v.label;
      el("label").style.top = cy - R - thick / 2 - 96 + "px";
      if (!String(v.label).trim()) fx.hide("label");
      const want = String(v.pick).trim().toLowerCase();
      const at = Math.max(0, items.findIndex((s) => s.toLowerCase() === want));
      const end = -at * step;

      const tl = gsap.timeline({ paused: true });
      tl.from(["#band", "#dial", "#pointer", "#label"], { opacity: 0, duration: 0.2 }, 0);
      tl.fromTo("#dial", { rotation: end + 360 * num("turns", 1.5) }, { rotation: end, duration: 1.3, ease: "power3.out" }, 0.1);
      tl.set("#i" + at, { color: "#f5cf45" }, 1.25);
      tl.fromTo("#pointer", { y: -14 }, { y: 0, duration: 0.2, ease: "power3.out" }, 1.25);
      fx.done("day-dial", tl);
    </script>
  </body>
</html>
